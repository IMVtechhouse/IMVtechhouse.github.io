<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant High-Contrast Blue Gradient -->
    <linearGradient id="imvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00B4D8" />
      <stop offset="100%" stopColor="#0077B6" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Glowing Rounded Square Badge (Visible on ANY tab color) -->
  <rect width="128" height="128" rx="30" fill="url(#imvBg)" />
  <rect x="2" y="2" width="124" height="124" rx="28" stroke="#90E0EF" stroke-width="4" stroke-opacity="0.8" />

  <!-- Bold, Ultra-Legible IMV Monogram in Pure White -->
  <g filter="url(#glow)">
    <!-- Letter 'I' (Thick & Solid) -->
    <rect x="18" y="32" width="18" height="64" rx="5" fill="#FFFFFF" />

    <!-- Letter 'M' (Solid Bold Architecture) -->
    <path d="M44 96V32H60L72 62L84 32H100V96H84V56L74 80H70L60 56V96H44Z" fill="#FFFFFF" />

    <!-- High-Impact Cyan Accent Bar along bottom to signify 'V' & Tech House -->
    <path d="M72 74L86 96H108L84 58L72 74Z" fill="#CAF0F8" />
  </g>
</svg>